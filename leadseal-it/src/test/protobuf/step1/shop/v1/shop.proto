syntax = "proto3";

package shop.v1;

import "google/protobuf/timestamp.proto";
import "leadseal/v1/options.proto";

message Customer {
  option (leadseal.v1.table) = {name: "customers"};

  int64 id = 1 [(leadseal.v1.column).primary_key = true];
  string email = 2 [(leadseal.v1.column) = {length: 200, unique: true}];
}

message Order {
  option (leadseal.v1.table) = {name: "orders"};

  int64 id = 1 [(leadseal.v1.column).primary_key = true];
  int64 customer_id = 2 [(leadseal.v1.column).foreign_key = {message: "shop.v1.Customer", on_delete: ACTION_CASCADE}];
  string state = 3 [(leadseal.v1.column) = {length: 20, index: true}];
  google.protobuf.Timestamp created = 4;
}
