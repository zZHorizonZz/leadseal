syntax = "proto3";

package comments.v7;

import "leadseal/v1/options.proto";

message Order {
  option (leadseal.v1.table) = {name: "orders"};

  int64 id = 1 [(leadseal.v1.column).primary_key = true];
  // State.
  string status = 2 [(leadseal.v1.column).text = {length: 20}];
  // The new state.
  optional string state = 3;
}
