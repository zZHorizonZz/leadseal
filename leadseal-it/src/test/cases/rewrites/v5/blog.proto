syntax = "proto3";

package rewrites.v5;

import "google/protobuf/timestamp.proto";
import "leadseal/v1/options.proto";

message Post {
  option (leadseal.v1.table) = {name: "articles"};

  int64 id = 1 [(leadseal.v1.column).primary_key = true];
  string title = 2;
  optional string slug = 3;
  optional string label = 4 [(leadseal.v1.column).text = {length: 50}];
  int32 revision = 5 [(leadseal.v1.column).integer = {default_value: 0}];
  google.protobuf.Timestamp modified = 6;
}
