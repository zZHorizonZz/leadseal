syntax = "proto3";

package columns.v17;

import "leadseal/v1/options.proto";

message Order {
  option (leadseal.v1.table) = {name: "orders"};

  int64 id = 1 [(leadseal.v1.column).primary_key = true];
  string code = 2 [(leadseal.v1.column) = {index: true, text: {length: 20, collation: [{key: "postgresql" value: "C"}, {key: "mariadb" value: "utf8mb4_bin"}, {key: "sqlserver" value: "Latin1_General_BIN2"}, {key: "sqlite" value: "BINARY"}]}}];
}
