syntax = "proto3";

package columns.v14;

import "leadseal/v1/options.proto";

message Order {
  option (leadseal.v1.table) = {name: "orders"};

  int64 id = 1 [(leadseal.v1.column).primary_key = true];
  string day = 2 [(leadseal.v1.column).date = {}];
  string hour = 3 [(leadseal.v1.column).time = {}];
}
