syntax = "proto3";

package keys.v8;

import "leadseal/v1/options.proto";

message Customer {
  option (leadseal.v1.table) = {name: "customers"};

  int64 id = 1 [(leadseal.v1.column).primary_key = true];
}

message Order {
  option (leadseal.v1.table) = {name: "orders"};

  int64 id = 1 [(leadseal.v1.column).primary_key = true];
  optional int64 customer_id = 2 [(leadseal.v1.column).foreign_key = {message: "keys.v8.Customer", on_delete: ACTION_SET_NULL}];
  int32 line = 3;
}
