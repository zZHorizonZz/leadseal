syntax = "proto3";

package keys.v17;

import "leadseal/v1/options.proto";

message Customer {
  option (leadseal.v1.table) = {name: "customers"};

  int64 id = 1 [(leadseal.v1.column).primary_key = true];
}

message Order {
  option (leadseal.v1.table) = {name: "orders"};

  int64 id = 1 [(leadseal.v1.column).primary_key = true];
  optional int64 buyer_id = 2 [(leadseal.v1.column).foreign_key = {message: "keys.v17.Customer", name: "fk_orders_customer"}];
  int32 line = 3;
}
