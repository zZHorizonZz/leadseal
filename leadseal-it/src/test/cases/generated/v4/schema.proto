syntax = "proto3";

package generated.v4;

import "leadseal/v1/options.proto";

message Order {
  option (leadseal.v1.table) = {name: "orders"};

  int64 id = 1 [(leadseal.v1.column).primary_key = true];
  int64 price = 2;
  int32 amount = 3;
  optional string note = 4;
  int64 total = 5 [(leadseal.v1.column).generated = "price * amount"];
  string label = 6 [(leadseal.v1.column).generated = "upper(note)"];
}
