syntax = "proto3";

package enums.v11;

import "leadseal/v1/options.proto";

message Shipment {
  option (leadseal.v1.table) = {name: "shipments"};

  int64 id = 1 [(leadseal.v1.column).primary_key = true];
}

message Return {
  option (leadseal.v1.table) = {name: "returns"};

  int64 id = 1 [(leadseal.v1.column).primary_key = true];
}
