syntax = "proto3";

package schemas.v2;

import "leadseal/v1/options.proto";

message Customer {
  option (leadseal.v1.table) = {
    name: "customers"
    schema: "sales"
  };

  int64 id = 1 [(leadseal.v1.column).primary_key = true];
  string name = 2 [(leadseal.v1.column) = {index: true, text: {length: 20}}];
}

message ArchivedCustomer {
  option (leadseal.v1.table) = {
    name: "customers"
    schema: "archive"
  };

  int64 id = 1 [(leadseal.v1.column).primary_key = true];
  string name = 2 [(leadseal.v1.column).text = {length: 20}];
}
