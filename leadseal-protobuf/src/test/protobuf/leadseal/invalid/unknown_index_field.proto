syntax = "proto3";

package leadseal.invalid;

import "leadseal/v1/options.proto";

option java_multiple_files = true;
option java_package = "dev.horizon.leadseal.protobuf.invalid.index";

message UnknownIndexField {
  option (leadseal.v1.table) = {index: {fields: ["missing"]}};

  int64 id = 1 [(leadseal.v1.column).primary_key = true];
}
