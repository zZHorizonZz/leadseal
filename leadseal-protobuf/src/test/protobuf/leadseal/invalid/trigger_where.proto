syntax = "proto3";

package leadseal.invalid;

import "leadseal/v1/options.proto";

option java_multiple_files = true;
option java_package = "dev.horizon.leadseal.protobuf.invalid.where";

message TriggerWhere {
  option (leadseal.v1.table) = {
    trigger: {
      name: "touch"
      on: [EVENT_INSERT]
      actions: [{update: {message: "leadseal.invalid.WhereTarget", set: [{key: "count" value: "count + 1"}]}}]
    }
  };

  int64 id = 1 [(leadseal.v1.column).primary_key = true];
}

message WhereTarget {
  option (leadseal.v1.table) = {};

  int64 id = 1 [(leadseal.v1.column).primary_key = true];
  int64 count = 2;
}
