syntax = "proto3";

package leadseal.invalid;

import "leadseal/v1/options.proto";

option java_multiple_files = true;
option java_package = "dev.horizon.leadseal.protobuf.invalid.enumdefault";

message UnknownEnumDefault {
  option (leadseal.v1.table) = {};

  enum State {
    STATE_UNSPECIFIED = 0;
  }

  int64 id = 1 [(leadseal.v1.column).primary_key = true];
  State state = 2 [(leadseal.v1.column).text.default_value = "STATE_GONE"];
}
