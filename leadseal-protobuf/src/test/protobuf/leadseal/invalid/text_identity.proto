syntax = "proto3";

package leadseal.invalid;

import "leadseal/v1/options.proto";

option java_multiple_files = true;
option java_package = "dev.horizon.leadseal.protobuf.invalid.identity";

message TextIdentity {
  option (leadseal.v1.table) = {};

  string id = 1 [(leadseal.v1.column) = {primary_key: true, integer: {identity: true}}];
}
