syntax = "proto3";

package leadseal.invalid;

import "leadseal/v1/options.proto";

option java_multiple_files = true;
option java_package = "dev.horizon.leadseal.protobuf.invalid.generated";

message GeneratedNullable {
  option (leadseal.v1.table) = {};

  int64 id = 1 [(leadseal.v1.column).primary_key = true];
  int64 price = 2;
  int64 total = 3 [(leadseal.v1.column) = {generated: "price * 2", nullable: false}];
}
