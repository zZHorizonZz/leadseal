syntax = "proto3";

package leadseal.invalid;

import "leadseal/v1/options.proto";

option java_multiple_files = true;
option java_package = "dev.horizon.leadseal.protobuf.invalid.rewrite";

message RewriteType {
  option (leadseal.v1.table) = {};

  int64 id = 1 [(leadseal.v1.column).primary_key = true];
  int64 revision = 2 [(leadseal.v1.column).rewrite = "'first'"];
}
