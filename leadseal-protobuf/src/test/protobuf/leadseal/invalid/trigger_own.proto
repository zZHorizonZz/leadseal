syntax = "proto3";

package leadseal.invalid;

import "leadseal/v1/options.proto";

option java_multiple_files = true;
option java_package = "dev.horizon.leadseal.protobuf.invalid.own";

message TriggerOwn {
  option (leadseal.v1.table) = {
    trigger: {
      name: "copy"
      on: [EVENT_INSERT]
      actions: [{insert: {message: "leadseal.invalid.TriggerOwn", values: [{key: "id" value: "id + 1"}]}}]
    }
  };

  int64 id = 1 [(leadseal.v1.column).primary_key = true];
}
